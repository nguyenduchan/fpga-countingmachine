# Project identity for the AMD Kria KV260 running Ubuntu 24.04.
# The C++ Ethernet camera on the board reads this file at startup.
# Keep these values aligned with kria/CMakeLists.txt and
# pc/EthernetCameraViewer/EthernetCameraViewer.csproj.

board_name=Kria KV260
ubuntu_version=24.04
camera_model=OV9281

# USB UVC node of the OV9281. Confirm with: v4l2-ctl --list-devices
video_device=/dev/video0
width=1280
height=800
# Highest MJPEG rate at 1280x800 on this OV9281. The server does not throttle below the camera.
fps=120

# TCP endpoint presented on the board Ethernet port.
bind_address=0.0.0.0
port=5600
jpeg_quality=85

# Brightness is leveled inside each tile before the Ethernet frame is sent.
tile_width=32
tile_height=32
