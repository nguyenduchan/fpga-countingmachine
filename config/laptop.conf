# Settings for this laptop. The Kria board uses config/board.conf.
# camera/eth_camera and the C# viewer read this file. Command-line values are optional.

mode=laptop
board_name=Laptop
ubuntu_version=Windows
camera_model=LG Camera
pixel_format=YUY2
video_device=0

# The LG camera driver delivers uncompressed YUY2 at 640x480, about 30 fps.
width=640
height=480
fps=30

# Program 1 listens here. The viewer connects to the same address.
bind_address=127.0.0.1
host=127.0.0.1
port=5600
jpeg_quality=85

# Used only by program 2, the FPGA stand-in. The kernel accepts 32x32.
tile_width=32
tile_height=32
